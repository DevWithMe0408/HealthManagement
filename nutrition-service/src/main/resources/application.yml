server:
  port: 8888

spring:
  application:
    name: nutrition-service

  datasource:
    url: jdbc:mysql://localhost:3306/nutrition_db
    username: nutrition_user
    password: nutrition_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true